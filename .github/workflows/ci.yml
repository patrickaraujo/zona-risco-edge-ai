name: CI — testes e build multi-arquitetura

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1
      - run: pytest -v

  docker:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # emulação arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test da imagem arm64 (sob QEMU)
        run: |
          docker buildx build --platform linux/arm64 -t zona-risco:arm64 --load .
          docker run --rm --platform linux/arm64 zona-risco:arm64 \
            python -c "import platform; from app.detector import PersonDetector; import cv2; \
          d = PersonDetector('models/yolo11n.onnx', num_threads=2); \
          r = d.detect(cv2.imread('samples/bus.jpg')); \
          print(platform.machine(), len(r.detections), 'pessoas', round(r.inference_ms), 'ms'); \
          assert platform.machine() == 'aarch64' and len(r.detections) >= 3"
